<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelPet</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="pet">
<section id="bubble" class="bubble hidden"><div id="messages"></div><form id="command-form"><input id="command-input" autocomplete="off" placeholder="Talk to PixelPet..."></form></section>
<div id="pet-stage"><div id="shadow"></div><div id="cat" class="cat idle" aria-label="PixelPet" title="Click me">
<div class="tail"></div><div class="ear left"></div><div class="ear right"></div>
<div class="head"><span class="eye left-eye"></span><span class="eye right-eye"></span><span class="nose"></span><span class="mouth"></span></div>
<div class="torso"></div><div class="leg back"></div><div class="leg front"></div><div class="paw back"></div><div class="paw front"></div>
</div></div></main><script src="./renderer.js"></script></body></html>
