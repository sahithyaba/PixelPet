<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPet</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="pet" aria-label="PixelPet">
    <div id="bubble" class="bubble hidden"></div>
    <div id="cat" class="cat idle" title="Double-click me!">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="face">
        <span class="eye left-eye"></span>
        <span class="eye right-eye"></span>
        <span class="nose"></span>
      </div>
      <div class="body"></div>
      <div class="tail"></div>
    </div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
