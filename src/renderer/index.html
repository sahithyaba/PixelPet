<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelPet</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="pet">
    <section id="bubble" class="bubble">
      <div id="messages"></div>
      <form id="command-form">
        <input id="command-input" autocomplete="off" placeholder="Talk to PixelPet..." />
      </form>
    </section>

    <div id="cat" class="cat idle" title="PixelPet">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="face">
        <span class="eye left-eye"></span>
        <span class="eye right-eye"></span>
        <span class="nose"></span>
        <span class="mouth"></span>
      </div>
      <div class="body"></div>
      <div class="tail"></div>
      <div class="paw left-paw"></div>
      <div class="paw right-paw"></div>
    </div>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
