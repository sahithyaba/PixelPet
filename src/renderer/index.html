<!doctype html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelPet</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="pet">
  <section id="bubble" class="bubble hidden"><div id="messages"></div><form id="command-form"><input id="command-input" autocomplete="off" placeholder="Talk to your dog..."></form></section>
  <div id="pet-stage">
    <div id="dog" class="dog idle" aria-label="PixelPet Dog" title="PixelPet">
      <div class="dog-art"></div>
      <button class="hotspot eye-zone touch-eye" aria-label="Touch eyes"></button>
      <button class="hotspot nose-zone touch-nose" aria-label="Touch nose"></button>
      <button class="hotspot collar-zone touch-collar" aria-label="Touch collar"></button>
      <button class="hotspot tail-zone-left touch-tail" aria-label="Touch tail"></button>
      <button class="hotspot tail-zone-right touch-tail" aria-label="Touch tail"></button>
    </div>
  </div>
</main>
<script src="./renderer.js"></script>
</body>
</html>
