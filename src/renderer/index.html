<!doctype html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelPet</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main id="pet">
  <section id="bubble" class="bubble hidden"><div id="messages"></div><form id="command-form"><input id="command-input" autocomplete="off" placeholder="Talk to your dog..."></form></section>
  <div id="pet-stage">
    <div id="shadow"></div>
    <div id="dog" class="dog idle" aria-label="PixelPet Dog" title="PixelPet">
      <div class="tail touch-tail"></div><div class="ear ear-left"></div><div class="ear ear-right"></div>
      <div class="body"></div><div class="chest"></div>
      <div class="head"><div class="patch"></div><div class="eye eye-left touch-eye"></div><div class="eye eye-right touch-eye"></div><div class="muzzle"></div><div class="nose touch-nose"></div><div class="mouth"></div><div class="tongue"></div></div>
      <div class="leg leg-back"></div><div class="leg leg-front"></div><div class="paw paw-back"></div><div class="paw paw-front"></div>
      <div class="collar touch-collar"></div><div class="tag">P</div>
    </div>
  </div>
</main>
<script src="./renderer.js"></script>
</body>
</html>
